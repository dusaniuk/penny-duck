[phases.setup]
nixPkgs = ["bun", "nodejs_22"]

[phases.install]
cmds = ["corepack enable && corepack prepare pnpm@9.15.9 --activate && pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm build"]

# The actual start command is configured per-service in the Railway dashboard:
#   API service:  pnpm db:deploy && pnpm start:api
#   Web service:  pnpm start:web
