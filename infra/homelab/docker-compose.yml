# Penny Duck on Coolify, as a Git-based Docker Compose application.
# ${...} values are set on the application's Environment Variables page.
# Images come from .github/workflows/images.yml; IMAGE_TAG is the branch the
# deploy watcher follows, or a commit SHA to pin a rollback.

services:
  api:
    image: ghcr.io/dusaniuk/penny-duck-api:${IMAGE_TAG:-main}
    # Migrations run before the API starts. The API is a single instance, so
    # they never race; if one fails the API stays down and the schema is left
    # as it was.
    command:
      - sh
      - -c
      - bun --cwd packages/db src/migrate.ts && exec bun apps/api/src/main.ts
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      WEB_URL: ${WEB_URL:?}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3030/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    # The coolify network is where the standalone Postgres resource lives.
    networks: [default, coolify]
    restart: unless-stopped

  web:
    image: ghcr.io/dusaniuk/penny-duck-web:${IMAGE_TAG:-main}
    environment:
      API_URL: http://api:3030
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/legal/privacy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  coolify:
    external: true
